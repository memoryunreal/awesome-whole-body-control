name: Publish Paper Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'papers.csv'
      - 'research_chunks/**'
      - 'reports/curated/**'
      - 'search_log.md'
      - 'data/paper-watch.json'
      - 'web/**'
      - 'paper_watch/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pipeline
        run: python -m unittest discover -s tests -q
      - name: Validate interface
        run: node --check web/app.js
      - name: Build public library from the latest weekly CSV
        run: python -m paper_watch.publish --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
